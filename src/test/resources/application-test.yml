server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

oauth:
  endpoint.url: http://localhost:9090/auth

aws:
  provider: localstack
  athena:
    database: "the-database"
    table: "the-table"
    workgroup: "the-workgroup"
    outputLocation: "the-location"
    prisonerDatabase: "the-prisoner-database"
    prisonerTable: "the-prisoner-table"
    prisonerWorkgroup: "the-prisoner-workgroup"
    prisonerOutputLocation: "the-prisoner-location"
  s3:
    auditBucketName: "hmpps-audit-bucket"
    prisonerAuditBucketName: "hmpps-prisoner-audit-bucket"

hmpps.sqs:
  provider: localstack
  queues:
    auditqueue:
      queueName: ${random.uuid}
      asyncQueueClient: true
      dlqName: ${random.uuid}
    auditusersqueue:
      queueName: ${random.uuid}
      asyncQueueClient: true
      dlqName: ${random.uuid}
    prisonerauditqueue:
      queueName: ${random.uuid}
      asyncQueueClient: true
      dlqName: ${random.uuid}
    persononprobationauditqueue:
      queueName: ${random.uuid}
      asyncQueueClient: true
      dlqName: ${random.uuid}

spring:
  datasource:
    url: 'jdbc:h2:mem:audit-db;MODE=PostgreSQL'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/audit,db/audit_{vendor}
    schemas: staff,prisoner,person_on_probation
    default-schema: staff

hmpps:
  repository:
    saveToS3Bucket: true
  audit:
    queriesStartDate: 2024-01-01
  applicationinsights:
    auditEventDetails: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true